name: Desktop CI
on:
  push:
    branches: [main, 'feature/**']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install desktop system dependencies
        run: npx playwright install --with-deps chromium
      - name: Type check and build
        run: npm run build
      - name: Run unit and Electron desktop tests
        run: xvfb-run -a npm test
      - name: Upload test reports and resolved dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-checks
          path: |
            playwright-report/
            test-results/
            package-lock.json
          retention-days: 7
