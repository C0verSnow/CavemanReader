name: Build release packages
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            extension: deb
          - os: windows-2025
            target: win
            extension: exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npm run package:desktop -- --${{ matrix.target }} --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: release/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build:web
      - run: npm run mobile:prepare -- android
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/CavemanReader-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: release/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run mobile:prepare -- ios
      - name: Build unsigned device archive
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/CavemanReader.xcarchive"
          archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA for manual signing
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload" release
          cp -R "$RUNNER_TEMP/CavemanReader.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/release/CavemanReader-ios-unsigned.ipa" Payload)
          unzip -t release/CavemanReader-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: package-ios
          path: release/*.ipa
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'release'
    needs: [desktop, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Upload all packages to the triggering Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/*.deb release/*.exe release/*.apk release/*.ipa --clobber
